<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sky Demo</title>
<link rel="stylesheet" href="sky.css">
<style>
  html, body { margin: 0; min-height: 100%; }
  body { min-height: 100vh; display: grid; place-items: center; font-family: system-ui, sans-serif; }
  .slot {
    position: relative;
    z-index: 1;
    box-sizing: border-box;
    width: min(600px, calc(100vw - 32px));
    height: 340px;
    border: 1.5px dashed rgba(255, 255, 255, 0.7);
    border-radius: 18px;
    background: rgba(255, 255, 255, 0.06);
  }
  .time {
    position: fixed;
    z-index: 2;
    top: 16px;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    align-items: center;
    gap: 12px;
    box-sizing: border-box;
    width: min(420px, calc(100vw - 32px));
    padding: 10px 16px;
    border-radius: 999px;
    background: rgba(12, 38, 51, 0.72);
    color: #F6F4EE;
    font-size: 13px;
  }
  .time input { flex: 1; min-width: 0; }
  .time output { width: 7ch; text-align: right; font-variant-numeric: tabular-nums; }
  .hide-ui .time, .hide-ui .slot { display: none; }
</style>
</head>
<body>
<div class="sky" aria-hidden="true"></div>
<div class="slot" aria-hidden="true"></div>
<label class="time">Time of day
  <input id="t" type="range" min="0" max="1" step="0.01" value="0">
  <output for="t" id="tv">0.00</output>
</label>
<script type="module">
  import { initSky } from './sky.js';
  const sky = initSky(document.querySelector('.sky'));
  const input = document.getElementById('t');
  const out = document.getElementById('tv');
  const params = new URLSearchParams(location.search);
  if (params.has('t')) input.value = params.get('t');
  if (params.has('clean')) document.body.classList.add('hide-ui');
  const apply = () => {
    sky.setTime(+input.value);
    out.value = (+input.value).toFixed(2);
  };
  input.addEventListener('input', apply);
  apply();
  window.sky = sky;
</script>
</body>
</html>
