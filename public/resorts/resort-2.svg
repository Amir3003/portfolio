<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="100%" height="100%">
  <defs>
    <linearGradient id="sky2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#051021"/>
      <stop offset="50%" stop-color="#122a4d"/>
      <stop offset="85%" stop-color="#2a4d70"/>
      <stop offset="100%" stop-color="#3d6387"/>
    </linearGradient>
    <linearGradient id="sea2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0a2942"/>
      <stop offset="50%" stop-color="#0e415e"/>
      <stop offset="100%" stop-color="#072033"/>
    </linearGradient>
    <linearGradient id="waveFacade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#10253d"/>
      <stop offset="60%" stop-color="#23456b"/>
      <stop offset="100%" stop-color="#0d1f33"/>
    </linearGradient>
    <linearGradient id="pool2" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="50%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0ea5e9"/>
    </linearGradient>
  </defs>

  <!-- Sky -->
  <rect width="800" height="480" fill="url(#sky2)"/>

  <!-- Moon / Ambient Crest -->
  <circle cx="680" cy="80" r="32" fill="#e0f2fe" opacity="0.8"/>
  <circle cx="672" cy="74" r="28" fill="#122a4d"/>

  <!-- Distant horizon -->
  <rect y="230" width="800" height="250" fill="url(#sea2)"/>

  <!-- Wave Facade (Jumeirah Beach Hotel sweeping wave design) -->
  <path d="M140 280 C180 180, 260 100, 360 80 C440 65, 520 120, 620 280 Z" fill="url(#waveFacade)"/>

  <!-- Curved Window Bands -->
  <g fill="#fde047" opacity="0.4">
    <path d="M220 220 Q360 140 500 220" stroke="#fef08a" stroke-width="3" fill="none" opacity="0.6"/>
    <path d="M250 190 Q360 120 470 190" stroke="#fef08a" stroke-width="3" fill="none" opacity="0.5"/>
    <path d="M280 160 Q360 105 440 160" stroke="#fef08a" stroke-width="3" fill="none" opacity="0.7"/>
    <path d="M190 250 Q360 165 530 250" stroke="#fef08a" stroke-width="3" fill="none" opacity="0.5"/>
  </g>

  <!-- Private Marina Pier & Yachts -->
  <polygon points="560,260 760,270 750,285 550,275" fill="#081829"/>
  <!-- Yacht masts -->
  <line x1="620" y1="230" x2="620" y2="265" stroke="#94a3b8" stroke-width="2"/>
  <polygon points="620,235 640,250 620,255" fill="#e2e8f0" opacity="0.7"/>
  <line x1="680" y1="225" x2="680" y2="268" stroke="#94a3b8" stroke-width="2"/>
  <polygon points="680,230 705,248 680,255" fill="#e2e8f0" opacity="0.8"/>

  <!-- Beachfront & Pool Terraces -->
  <path d="M60 280 L740 280 L800 480 L0 480 Z" fill="#06121f"/>

  <!-- Curving Lagoon Pools -->
  <ellipse cx="360" cy="360" rx="240" ry="50" fill="url(#pool2)" opacity="0.85"/>
  <ellipse cx="350" cy="355" rx="190" ry="32" fill="#7dd3fc" opacity="0.4"/>

  <!-- Beach Cabanas & Sun Loungers -->
  <g fill="#38bdf8" opacity="0.7">
    <rect x="180" y="320" width="18" height="10" rx="2"/>
    <rect x="220" y="325" width="18" height="10" rx="2"/>
    <rect x="260" y="330" width="18" height="10" rx="2"/>
    <rect x="460" y="330" width="18" height="10" rx="2"/>
    <rect x="500" y="325" width="18" height="10" rx="2"/>
    <rect x="540" y="320" width="18" height="10" rx="2"/>
  </g>

  <!-- Palm Silhouettes -->
  <g fill="#030912">
    <path d="M80 480 Q100 370 120 300 Q95 370 70 480 Z"/>
    <path d="M120 300 Q80 270 50 285 Q80 290 120 300 Z"/>
    <path d="M120 300 Q120 250 150 245 Q135 270 120 300 Z"/>
    <path d="M120 300 Q160 270 175 295 Q145 295 120 300 Z"/>

    <path d="M720 480 Q700 380 690 310 Q710 380 730 480 Z"/>
    <path d="M690 310 Q725 280 755 295 Q725 300 690 310 Z"/>
    <path d="M690 310 Q685 260 660 255 Q675 275 690 310 Z"/>
  </g>
</svg>
