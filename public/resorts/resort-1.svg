<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="100%" height="100%">
  <defs>
    <linearGradient id="sky1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#07152b"/>
      <stop offset="40%" stop-color="#142c4c"/>
      <stop offset="70%" stop-color="#2a486c"/>
      <stop offset="100%" stop-color="#556b82"/>
    </linearGradient>
    <linearGradient id="sea1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#09253d"/>
      <stop offset="50%" stop-color="#0b3856"/>
      <stop offset="100%" stop-color="#061e33"/>
    </linearGradient>
    <linearGradient id="pool1" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#14b8a6"/>
      <stop offset="50%" stop-color="#2dd4bf"/>
      <stop offset="100%" stop-color="#0d9488"/>
    </linearGradient>
    <linearGradient id="tower1" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0f1f33"/>
      <stop offset="50%" stop-color="#1e344e"/>
      <stop offset="100%" stop-color="#0a1726"/>
    </linearGradient>
    <linearGradient id="glass1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0.1"/>
    </linearGradient>
  </defs>

  <!-- Sky -->
  <rect width="800" height="480" fill="url(#sky1)"/>

  <!-- Stars / Dusk Lights -->
  <circle cx="120" cy="60" r="1.5" fill="#ffffff" opacity="0.6"/>
  <circle cx="280" cy="40" r="1" fill="#ffffff" opacity="0.5"/>
  <circle cx="560" cy="70" r="1.5" fill="#ffffff" opacity="0.7"/>
  <circle cx="720" cy="50" r="1" fill="#ffffff" opacity="0.4"/>

  <!-- Distant Coast / Horizon Skyline -->
  <path d="M0 240 L120 236 L180 238 L250 234 L310 237 L400 235 L520 238 L680 235 L800 238 L800 270 L0 270 Z" fill="#081829" opacity="0.8"/>

  <!-- Sea -->
  <rect y="240" width="800" height="240" fill="url(#sea1)"/>

  <!-- Water Reflections -->
  <ellipse cx="400" cy="310" rx="360" ry="14" fill="#14b8a6" opacity="0.15"/>
  <ellipse cx="440" cy="350" rx="280" ry="10" fill="#2dd4bf" opacity="0.2"/>

  <!-- Main Resort Tower (Twin Arch Architecture like Address Beach Resort) -->
  <!-- Left Tower -->
  <rect x="260" y="70" width="110" height="230" rx="4" fill="url(#tower1)"/>
  <!-- Right Tower -->
  <rect x="430" y="70" width="110" height="230" rx="4" fill="url(#tower1)"/>
  <!-- Sky Bridge / Infinity Pool on top (77th floor) -->
  <rect x="250" y="65" width="300" height="28" rx="6" fill="#1e344e"/>
  <rect x="280" y="68" width="240" height="8" rx="3" fill="#2dd4bf" opacity="0.85"/>

  <!-- Window Rows / Illuminated Balconies -->
  <g fill="#fef08a" opacity="0.45">
    <rect x="275" y="110" width="20" height="4"/>
    <rect x="305" y="110" width="20" height="4"/>
    <rect x="335" y="110" width="20" height="4"/>
    <rect x="275" y="130" width="20" height="4"/>
    <rect x="305" y="130" width="20" height="4"/>
    <rect x="335" y="130" width="20" height="4"/>
    <rect x="275" y="150" width="20" height="4"/>
    <rect x="305" y="150" width="20" height="4"/>
    <rect x="335" y="150" width="20" height="4"/>
    <rect x="275" y="180" width="20" height="4"/>
    <rect x="305" y="180" width="20" height="4"/>
    <rect x="335" y="180" width="20" height="4"/>
    <rect x="275" y="210" width="20" height="4"/>
    <rect x="305" y="210" width="20" height="4"/>
    <rect x="335" y="210" width="20" height="4"/>

    <rect x="445" y="110" width="20" height="4"/>
    <rect x="475" y="110" width="20" height="4"/>
    <rect x="505" y="110" width="20" height="4"/>
    <rect x="445" y="130" width="20" height="4"/>
    <rect x="475" y="130" width="20" height="4"/>
    <rect x="505" y="130" width="20" height="4"/>
    <rect x="445" y="150" width="20" height="4"/>
    <rect x="475" y="150" width="20" height="4"/>
    <rect x="505" y="150" width="20" height="4"/>
    <rect x="445" y="180" width="20" height="4"/>
    <rect x="475" y="180" width="20" height="4"/>
    <rect x="505" y="180" width="20" height="4"/>
    <rect x="445" y="210" width="20" height="4"/>
    <rect x="475" y="210" width="20" height="4"/>
    <rect x="505" y="210" width="20" height="4"/>
  </g>

  <!-- Glowing Atrium Sky Gap -->
  <path d="M370 120 L430 120 L430 300 L370 300 Z" fill="url(#glass1)"/>

  <!-- Podium / Beachfront Terrace -->
  <path d="M120 300 L680 300 L740 480 L60 480 Z" fill="#081422"/>

  <!-- Tiered Infinity Pool -->
  <polygon points="180,330 620,330 660,400 140,400" fill="url(#pool1)" opacity="0.9"/>
  <polygon points="210,340 590,340 620,390 180,390" fill="#5eead4" opacity="0.35"/>

  <!-- Palm Tree Silhouettes (Left) -->
  <g fill="#040b13">
    <!-- Trunk 1 -->
    <path d="M90 480 Q105 380 120 310 Q115 380 82 480 Z"/>
    <!-- Fronds 1 -->
    <path d="M120 310 Q90 280 60 290 Q90 295 120 310 Z"/>
    <path d="M120 310 Q110 270 140 260 Q130 280 120 310 Z"/>
    <path d="M120 310 Q150 285 170 305 Q145 305 120 310 Z"/>
    <path d="M120 310 Q80 320 65 340 Q95 330 120 310 Z"/>

    <!-- Trunk 2 -->
    <path d="M680 480 Q670 390 660 320 Q675 390 690 480 Z"/>
    <!-- Fronds 2 -->
    <path d="M660 320 Q690 290 720 300 Q690 305 660 320 Z"/>
    <path d="M660 320 Q670 275 640 265 Q650 285 660 320 Z"/>
    <path d="M660 320 Q630 290 610 315 Q635 315 660 320 Z"/>
  </g>

  <!-- Ambient Glow overlay -->
  <circle cx="400" cy="80" r="180" fill="#2dd4bf" opacity="0.08"/>
</svg>
