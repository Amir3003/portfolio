<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="100%" height="100%">
  <defs>
    <linearGradient id="sky4" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#041221"/>
      <stop offset="50%" stop-color="#0c2d47"/>
      <stop offset="85%" stop-color="#19546b"/>
      <stop offset="100%" stop-color="#2d8291"/>
    </linearGradient>
    <linearGradient id="lagoon4" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0e6878"/>
      <stop offset="40%" stop-color="#14b8a6"/>
      <stop offset="100%" stop-color="#083344"/>
    </linearGradient>
    <linearGradient id="villaRoof" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#78350f"/>
      <stop offset="100%" stop-color="#451a03"/>
    </linearGradient>
  </defs>

  <!-- Sky -->
  <rect width="800" height="480" fill="url(#sky4)"/>

  <!-- Tropical Island Silhouette on horizon -->
  <path d="M0 240 Q160 210 320 235 Q480 200 640 230 Q740 220 800 240 L800 270 L0 270 Z" fill="#042f2e"/>
  <!-- Distant Palm Fronds on Island -->
  <g fill="#042f2e" opacity="0.8">
    <path d="M140 210 Q160 190 180 200 Q160 205 140 210 Z"/>
    <path d="M460 200 Q480 180 500 190 Q480 195 460 200 Z"/>
  </g>

  <!-- Azure Lagoon -->
  <rect y="240" width="800" height="240" fill="url(#lagoon4)"/>
  <ellipse cx="400" cy="300" rx="350" ry="25" fill="#5eead4" opacity="0.3"/>

  <!-- Wooden Overwater Walkway / Boardwalk Pier -->
  <polygon points="400,240 405,240 680,480 630,480" fill="#292524"/>
  <!-- Pilings / Posts -->
  <g stroke="#1c1917" stroke-width="4">
    <line x1="430" y1="260" x2="430" y2="290"/>
    <line x1="480" y1="310" x2="480" y2="350"/>
    <line x1="550" y1="370" x2="550" y2="420"/>
  </g>

  <!-- Overwater Luxury Villa 1 (Left) -->
  <!-- Stilts -->
  <line x1="160" y1="280" x2="160" y2="340" stroke="#0f172a" stroke-width="5"/>
  <line x1="260" y1="280" x2="260" y2="340" stroke="#0f172a" stroke-width="5"/>
  <line x1="210" y1="280" x2="210" y2="340" stroke="#0f172a" stroke-width="4"/>
  <!-- Deck -->
  <rect x="140" y="275" width="140" height="15" rx="3" fill="#44403c"/>
  <rect x="230" y="278" width="45" height="10" rx="2" fill="#38bdf8" opacity="0.8"/> <!-- Private plunge pool -->
  <!-- Villa Wall -->
  <rect x="155" y="210" width="85" height="65" fill="#1e293b"/>
  <!-- Thatch Roof -->
  <polygon points="140,215 197,165 255,215" fill="url(#villaRoof)"/>
  <!-- Warm Lit Windows -->
  <rect x="170" y="230" width="22" height="30" rx="2" fill="#fef08a" opacity="0.75"/>
  <rect x="202" y="230" width="22" height="30" rx="2" fill="#fef08a" opacity="0.6"/>

  <!-- Overwater Luxury Villa 2 (Right) -->
  <line x1="560" y1="260" x2="560" y2="310" stroke="#0f172a" stroke-width="4"/>
  <line x1="640" y1="260" x2="640" y2="310" stroke="#0f172a" stroke-width="4"/>
  <rect x="545" y="255" width="110" height="12" rx="2" fill="#44403c"/>
  <rect x="560" y="200" width="70" height="55" fill="#1e293b"/>
  <polygon points="545,205 595,160 645,205" fill="url(#villaRoof)"/>
  <rect x="575" y="215" width="18" height="25" rx="2" fill="#fef08a" opacity="0.7"/>

  <!-- Foreground Beach & Giant Tropical Palms -->
  <path d="M0 360 Q120 330 240 370 Q160 440 0 480 Z" fill="#082f49"/>

  <g fill="#021c27">
    <!-- Palm Trunk -->
    <path d="M20 480 Q50 360 80 270 Q45 360 5 480 Z"/>
    <!-- Fronds -->
    <path d="M80 270 Q30 230 0 240 Q40 250 80 270 Z"/>
    <path d="M80 270 Q80 210 120 205 Q100 235 80 270 Z"/>
    <path d="M80 270 Q130 240 150 270 Q115 270 80 270 Z"/>
    <path d="M80 270 Q50 300 20 310 Q50 295 80 270 Z"/>
  </g>
</svg>
