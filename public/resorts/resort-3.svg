<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="100%" height="100%">
  <defs>
    <linearGradient id="sky3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#09142b"/>
      <stop offset="45%" stop-color="#182d4f"/>
      <stop offset="75%" stop-color="#3b3359"/>
      <stop offset="100%" stop-color="#734968"/>
    </linearGradient>
    <linearGradient id="sea3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#181c3b"/>
      <stop offset="60%" stop-color="#101930"/>
      <stop offset="100%" stop-color="#080e1c"/>
    </linearGradient>
    <linearGradient id="atlantisBlock" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1b2a47"/>
      <stop offset="50%" stop-color="#2d456f"/>
      <stop offset="100%" stop-color="#142138"/>
    </linearGradient>
    <linearGradient id="skyPool" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="50%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#0891b2"/>
    </linearGradient>
  </defs>

  <!-- Sky -->
  <rect width="800" height="480" fill="url(#sky3)"/>

  <!-- Golden hour sun glow -->
  <circle cx="400" cy="220" r="140" fill="#f59e0b" opacity="0.18"/>

  <!-- Sea -->
  <rect y="240" width="800" height="240" fill="url(#sea3)"/>
  <ellipse cx="400" cy="290" rx="320" ry="12" fill="#f43f5e" opacity="0.15"/>
  <ellipse cx="400" cy="330" rx="260" ry="10" fill="#22d3ee" opacity="0.2"/>

  <!-- Atlantis The Royal Iconic Stepped Cantilever Blocks -->
  <!-- Base Blocks -->
  <rect x="180" y="200" width="130" height="70" fill="url(#atlantisBlock)"/>
  <rect x="330" y="210" width="140" height="60" fill="url(#atlantisBlock)"/>
  <rect x="490" y="200" width="130" height="70" fill="url(#atlantisBlock)"/>

  <!-- Level 2 Blocks -->
  <rect x="200" y="150" width="110" height="55" fill="url(#atlantisBlock)"/>
  <rect x="490" y="150" width="110" height="55" fill="url(#atlantisBlock)"/>

  <!-- Level 3 Cantilevers -->
  <rect x="220" y="105" width="100" height="50" fill="url(#atlantisBlock)"/>
  <rect x="480" y="105" width="100" height="50" fill="url(#atlantisBlock)"/>

  <!-- Massive Suspended Sky Pool Bridge (90m up) -->
  <rect x="310" y="125" width="180" height="18" rx="4" fill="#0e1e36"/>
  <rect x="315" y="127" width="170" height="8" rx="2" fill="url(#skyPool)"/>

  <!-- Illuminated Penthouse Windows -->
  <g fill="#fef08a" opacity="0.55">
    <rect x="230" y="115" width="15" height="5"/>
    <rect x="255" y="115" width="15" height="5"/>
    <rect x="280" y="115" width="15" height="5"/>

    <rect x="495" y="115" width="15" height="5"/>
    <rect x="520" y="115" width="15" height="5"/>
    <rect x="545" y="115" width="15" height="5"/>

    <rect x="210" y="160" width="15" height="5"/>
    <rect x="235" y="160" width="15" height="5"/>
    <rect x="260" y="160" width="15" height="5"/>
    <rect x="285" y="160" width="15" height="5"/>

    <rect x="500" y="160" width="15" height="5"/>
    <rect x="525" y="160" width="15" height="5"/>
    <rect x="550" y="160" width="15" height="5"/>
    <rect x="575" y="160" width="15" height="5"/>

    <rect x="190" y="210" width="15" height="5"/>
    <rect x="215" y="210" width="15" height="5"/>
    <rect x="240" y="210" width="15" height="5"/>
    <rect x="265" y="210" width="15" height="5"/>

    <rect x="500" y="210" width="15" height="5"/>
    <rect x="525" y="210" width="15" height="5"/>
    <rect x="550" y="210" width="15" height="5"/>
    <rect x="575" y="210" width="15" height="5"/>
  </g>

  <!-- Ground Pool Terraces & Beach Lounge -->
  <polygon points="100,270 700,270 760,480 40,480" fill="#08101f"/>
  <polygon points="160,310 640,310 680,380 120,380" fill="url(#skyPool)" opacity="0.9"/>
  <polygon points="180,320 620,320 650,370 150,370" fill="#a5f3fc" opacity="0.3"/>

  <!-- Palm Silhouettes -->
  <g fill="#040812">
    <path d="M70 480 Q90 380 110 310 Q85 380 60 480 Z"/>
    <path d="M110 310 Q70 280 45 295 Q75 300 110 310 Z"/>
    <path d="M110 310 Q110 260 140 255 Q125 280 110 310 Z"/>

    <path d="M730 480 Q710 380 700 310 Q720 380 740 480 Z"/>
    <path d="M700 310 Q735 280 765 295 Q735 300 700 310 Z"/>
  </g>
</svg>
