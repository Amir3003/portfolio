<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="100%" height="100%">
  <defs>
    <linearGradient id="sky5" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#030c1c"/>
      <stop offset="45%" stop-color="#0c233c"/>
      <stop offset="80%" stop-color="#1e3a57"/>
      <stop offset="100%" stop-color="#3d586e"/>
    </linearGradient>
    <linearGradient id="lagoon5" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0d3b4a"/>
      <stop offset="50%" stop-color="#115e59"/>
      <stop offset="100%" stop-color="#042f2e"/>
    </linearGradient>
    <linearGradient id="pavilionRoof" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9a3412"/>
      <stop offset="100%" stop-color="#431407"/>
    </linearGradient>
  </defs>

  <!-- Sky -->
  <rect width="800" height="480" fill="url(#sky5)"/>

  <!-- Distant Palm Island Crescent -->
  <path d="M0 230 Q250 200 500 225 Q650 215 800 230 L800 260 L0 260 Z" fill="#082032"/>

  <!-- Serene Lagoon Waters -->
  <rect y="230" width="800" height="250" fill="url(#lagoon5)"/>
  <ellipse cx="400" cy="285" rx="360" ry="15" fill="#2dd4bf" opacity="0.25"/>

  <!-- Main Luxury Thai Pavilion Resort Complex -->
  <!-- Central Pavilion -->
  <rect x="330" y="150" width="140" height="80" rx="3" fill="#132438"/>
  <!-- Multi-tiered curved Pagoda/Thai Roof -->
  <path d="M300 155 Q400 135 500 155 L480 135 Q400 115 320 135 Z" fill="url(#pavilionRoof)"/>
  <path d="M330 135 Q400 110 470 135 L450 110 Q400 85 350 110 Z" fill="url(#pavilionRoof)"/>
  <polygon points="395,85 400,60 405,85" fill="#ca8a04"/> <!-- Golden spire -->

  <!-- Left Wing -->
  <rect x="180" y="170" width="130" height="60" rx="2" fill="#132438"/>
  <path d="M160 175 Q245 155 330 175 L315 155 Q245 140 175 155 Z" fill="url(#pavilionRoof)"/>

  <!-- Right Wing -->
  <rect x="490" y="170" width="130" height="60" rx="2" fill="#132438"/>
  <path d="M470 175 Q555 155 640 175 L625 155 Q555 140 485 155 Z" fill="url(#pavilionRoof)"/>

  <!-- Illuminated Lanterns and Balcony Windows -->
  <g fill="#fef08a" opacity="0.6">
    <rect x="350" y="180" width="20" height="25" rx="2"/>
    <rect x="390" y="180" width="20" height="25" rx="2"/>
    <rect x="430" y="180" width="20" height="25" rx="2"/>

    <rect x="200" y="190" width="18" height="20" rx="2"/>
    <rect x="235" y="190" width="18" height="20" rx="2"/>
    <rect x="270" y="190" width="18" height="20" rx="2"/>

    <rect x="510" y="190" width="18" height="20" rx="2"/>
    <rect x="545" y="190" width="18" height="20" rx="2"/>
    <rect x="580" y="190" width="18" height="20" rx="2"/>
  </g>

  <!-- Lagoon Pool Deck with Sunken Seating & Cabanas -->
  <path d="M60 250 L740 250 L800 480 L0 480 Z" fill="#081826"/>
  <!-- Lagoon Pool -->
  <ellipse cx="400" cy="350" rx="280" ry="60" fill="#0f766e" opacity="0.8"/>
  <ellipse cx="400" cy="345" rx="240" ry="40" fill="#14b8a6" opacity="0.35"/>

  <!-- Island Cabanas in the pool -->
  <rect x="240" y="310" width="30" height="20" rx="3" fill="#042f2e"/>
  <polygon points="230,312 255,295 280,312" fill="#9a3412"/>

  <rect x="530" y="310" width="30" height="20" rx="3" fill="#042f2e"/>
  <polygon points="520,312 545,295 570,312" fill="#9a3412"/>

  <!-- Framing Palms (Left & Right) -->
  <g fill="#020e17">
    <path d="M40 480 Q70 360 90 280 Q60 360 20 480 Z"/>
    <path d="M90 280 Q40 240 10 255 Q50 265 90 280 Z"/>
    <path d="M90 280 Q85 220 120 220 Q105 250 90 280 Z"/>
    <path d="M90 280 Q135 255 150 280 Q120 280 90 280 Z"/>

    <path d="M760 480 Q730 360 710 280 Q740 360 780 480 Z"/>
    <path d="M710 280 Q760 240 790 255 Q750 265 710 280 Z"/>
    <path d="M710 280 Q715 220 680 220 Q695 250 710 280 Z"/>
  </g>
</svg>
